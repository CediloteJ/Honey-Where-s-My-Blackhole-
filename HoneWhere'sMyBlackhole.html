<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sgr A* Observation Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PyScript to run exact Python script in browser -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-yellow-400">Sgr A* Optimal Wire Orientation & Track</h1>
      <p class="text-gray-400 text-sm">Automated Astronomical Observation Calculator</p>
    </header>

    <!-- Controls -->
    <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4 w-full md:w-auto">
        <label for="obsDate" class="font-medium text-gray-300 whitespace-nowrap">Observation Date:</label>
        <input type="date" id="obsDate" value="2026-09-15" class="bg-gray-700 border border-gray-600 text-white rounded-lg p-2 focus:ring-2 focus:ring-yellow-400 focus:outline-none w-full md:w-auto">
      </div>
      <button id="run-btn" py-click="run_calculation" class="w-full md:w-auto bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 px-6 rounded-lg transition duration-200">
        Calculate Schedule
      </button>
    </div>

    <!-- Output Terminal Display matching original terminal styling -->
    <div class="bg-black p-6 rounded-xl border border-gray-800 font-mono text-green-400 shadow-2xl">
      <div class="mb-2 font-bold border-b border-gray-800 pb-2">OPTIMAL WIRE ORIENTATION RESULTS FOR Sgr A*</div>
      <div id="output-terminal">
        Click "Calculate Schedule" to execute Python script...
      </div>
    </div>
  </div>

  <!-- PyScript Execution -->
  <script type="py">
import js
from pyscript import Element

def run_calculation(event=None):
    # Retrieve date from HTML input
    selected_date = Element("obsDate").element.value
    
    # -------------------------------------------------------------------
    # PASTE YOUR EXACT ORIGINAL PYTHON SCRIPT HERE
    # Ensure it calculates using observer coordinates and date.
    # Example structure matching your screenshot:
    # -------------------------------------------------------------------
    
    lat = 34.19
    lon = -79.65
    max_alt = 26.8
    wire1 = 50  # Calculated by your optimization loop
    wire2 = 140 # Calculated by your optimization loop
    peak_time = f"{selected_date} 23:26:00 UTC"
    peak_alt = 26.79

    # Formatting output strictly as shown in your terminal UI
    result_text = f"""
Observer Location : {lat:.2f}° N, {lon:.2f}° W
Target Max Alt    : {max_alt:.1f}° above horizon

BEST SETUP FOUND
Wire 1 Angle      : {wire1}° from North
Wire 2 Angle      : {wire2}° from North

Peak Viewing Time: {peak_time}
Peak Altitude     : {peak_alt:.2f}°
"""
    Element("output-terminal").element.innerText = result_text

  </script>
</body>
</html>
